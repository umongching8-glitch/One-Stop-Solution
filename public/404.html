<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>One Stop Solution</title>
    <script>
      // Single Page App redirect for GitHub Pages
      var path = window.location.pathname;
      var repo = '/One-Stop-Solution/';
      if (path.indexOf(repo) === 0) {
        window.location.replace(repo + window.location.search + window.location.hash);
      } else {
        window.location.replace('/' + window.location.search + window.location.hash);
      }
    </script>
  </head>
  <body>
  </body>
</html>
